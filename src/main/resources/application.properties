server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Kubernetes liveness/readiness probes -> /actuator/health/liveness and /readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# >>> CHANGE THIS LINE for the "code change" demo <<<
app.message=Hello from AKS - version 1
# Injected by the pipeline through the APP_VERSION env var (git commit SHA)
app.version=${APP_VERSION:local}
